replicaCount: 2
revisionHistoryLimit: 3
terminationGracePeriodSeconds: 30

image:
  repository: docker.io/iamtahmad1/traffic-manager-route-management-service
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

service:
  enabled: true
  type: ClusterIP
  port: 8002
  targetPort: 8002

containerPort: 8002

env:
  API_PORT: "8002"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MONGODB_HOST: "mongo"
  MONGODB_PORT: "27017"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

secretEnv: {}

probes:
  enabled: true
  path: /health
  port: 8002
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 6

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
